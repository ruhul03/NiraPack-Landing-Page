2264A;background:#F6F5E8}\n.np h1,.np h2,.np h3{font-family:Poppins,sans-serif;margin:0}\n.np a{text-decoration:none}\n.wrap{max-width:1120px;margin:0 auto;padding:0 24px}\n.nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0;flex-wrap:wrap;gap:12px}\n.nav nav{display:flex;gap:24px;flex-wrap:wrap}\n.nav nav a{color:#12264A;font-weight:500}\n.btn{display:inline-block;padding:14px 28px;border-radius:999px;font-weight:700;font-family:Poppins,sans-serif;min-height:20px}\n.btn-y{background:#FFC20E;color:#12264A}\n.btn-g{background:#0A724F;color:#fff}\n.hero{background:#0A724F;color:#fff;padding:72px 0}\n.hero .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center}\n.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}\n.card{background:#fff;border-radius:16px;padding:24px}\n.step{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}\n@media(max-width:760px){.hero .wrap{grid-template-columns:1fr}.hero h1{font-size:36px !important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"np\" data-canvas-width=\"1280\" data-canvas-height=\"3500\">\n<div class=\"wrap\">\n<div class=\"nav\">\n<a href=\"#top\" style=\"display:flex;align-items:center;gap:10px\"><img src=\"67cd76e1-7742-4246-ae14-11fd92c1a213\" alt=\"NiraPack logo\" style=\"width:44px;height:44px;object-fit:contain;border-radius:10px;background:#fff\"><span style=\"font-family:Poppins,sans-serif;font-weight:700;font-size:22px;color:#12264A\">NiraPack<\u002Fspan><\u002Fa>\n<nav><a href=\"#features\">Features<\u002Fa><a href=\"#how\">How it works<\u002Fa><a href=\"#price\">Price<\u002Fa><a href=\"#order\">Pre-order<\u002Fa><\u002Fnav>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<section class=\"hero\" id=\"top\">\n<div class=\"wrap\">\n<div>\n<p style=\"margin:0 0 12px;color:#FFC20E;font-weight:500\">Launching January 1, 2027 in Dhaka<\u002Fp>\n<h1 style=\"font-size:52px;line-height:1.1\">Know your child is safe.<\u002Fh1>\n<p style=\"font-size:18px;line-height:1.6;margin:20px 0 32px;max-width:520px\">The smart school bag with a hidden GPS tracker, SOS button and weight sensor. See where your child is, without giving them a phone.<\u002Fp>\n<a class=\"btn btn-y\" href=\"{{formLink}}\">Pre-order now<\u002Fa>\n<p style=\"margin:16px 0 0;font-size:14px\">10% launch discount and 3 months of app service free.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#F6F5E8;border-radius:24px;min-height:300px;display:flex;align-items:center;justify-content:center;color:#12264A;text-align:center;padding:24px\">\n<img src=\"59e05d33-0576-465a-8b5f-2e19eefb0a9b\" alt=\"NiraPack smart school bag\" style=\"max-width:100%;max-height:440px;object-fit:contain;border-radius:16px\">\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"features\" style=\"padding:72px 0\">\n<div class=\"wrap\">\n<h2 style=\"font-size:34px;margin-bottom:8px\">One bag. Four kinds of protection.<\u002Fh2>\n<p style=\"margin:0 0 32px;font-size:17px;max-width:640px\">Parents buy one product, not a bag plus a separate device.<\u002Fp>\n<div class=\"grid4\">\n<div class=\"card\"><h3 style=\"font-size:20px;color:#0A724F\">Live GPS<\u002Fh3><p style=\"line-height:1.6\">A hidden tracker shows the route from home to school in the app.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3 style=\"font-size:20px;color:#0A724F\">SOS button<\u002Fh3><p style=\"line-height:1.6\">One press sends the child's location to parents at once.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3 style=\"font-size:20px;color:#0A724F\">Weight alert<\u002Fh3><p style=\"line-height:1.6\">Warns when the bag goes over the safe limit of 10% of body weight.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3 style=\"font-size:20px;color:#0A724F\">Visible and durable<\u002Fh3><p style=\"line-height:1.6\">Reflective strips, waterproof fabric and a battery that lasts 5 days.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"inside\" style=\"padding:72px 0;
